<body>
  <main class="app"><header><div class="brand"><span class="brand-mark">✦</span>日々のカレンダー</div><div class="header-right"><div class="today-label" id="todayLabel"></div><span class="sync-status" id="syncStatus">この端末に保存中</span><button class="sync-button" id="syncButton" type="button">ログインして同期</button></div></header><div class="layout"><section class="calendar-card" aria-label="月間カレンダー"><div class="toolbar"><h1 id="monthTitle"></h1><div class="mode-switch"><button data-mode="schedule" class="active">予定</button><button data-mode="todo">To Do</button><button data-mode="saving">節約</button></div><div class="nav"><button class="icon-btn" id="prev" aria-label="前の月">‹</button><button class="icon-btn" id="goToday" aria-label="今日">●</button><button class="icon-btn" id="next" aria-label="次の月">›</button></div></div><div class="weekdays"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="grid" id="grid"></div></section><aside><section class="side-card"><button class="primary" id="addItem">＋ 予定を追加</button></section><section class="side-card progress-card" id="progressCard" hidden><h2 id="progressTitle"></h2><div id="progressBody"></div></section><section class="side-card" id="goalsCard" hidden><h2>目標</h2><form class="goal-form" id="goalForm"><input id="goalInput" maxlength="60" placeholder="例：今月中に資格を取る"><button type="submit">追加</button></form><div class="goal-list" id="goalList"></div></section><section class="side-card"><h2 id="listTitle">これからの予定</h2><div class="agenda" id="agenda"></div></section><section class="side-card"><h2>色の種類</h2><div class="legend"><span>通常</span><span class="l-work">仕事</span><span class="l-personal">プライベート</span><span class="l-important">大切</span><span class="l-shop">ショップ</span><span class="l-event">イベント</span><span class="l-other">その他</span></div></section></aside></div></main>
  <dialog id="itemDialog"><form class="modal" id="itemForm"><h2 id="formTitle">予定を追加</h2><input type="hidden" id="itemId"><label id="itemDateLabel" for="itemDate">日付</label><input id="itemDate" type="date" required><div id="rangeEndField" hidden><label for="itemEndDate">終了日</label><input id="itemEndDate" type="date"><p class="range-help">開始日から終了日まで、毎日同じ To Do を追加します。</p></div><div class="time-fields saving-hide"><div><label for="startTime">開始時刻（任意）</label><input id="startTime" type="time"></div><div><label for="endTime">終了時刻（任意）</label><input id="endTime" type="time"></div></div><label id="itemTitleLabel" for="itemTitle">予定</label><input id="itemTitle" placeholder="例：チームミーティング" maxlength="40" required autofocus><div class="saving-hide"><label for="itemType">カテゴリー</label><select id="itemType"><option value="normal">通常</option><option value="work">仕事</option><option value="personal">プライベート</option><option value="important">大切</option><option value="shop">ショップ</option><option value="event">イベント</option><option value="other">その他</option></select></div><div class="saving-hide"><label for="itemNote">メモ（任意）</label><textarea id="itemNote" placeholder="場所や詳細など"></textarea></div><label class="complete-field" id="completeField" hidden><input id="itemDone" type="checkbox"> 完了にする</label><div class="modal-actions"><button type="button" class="delete" id="deleteItem" hidden>削除</button><button type="button" class="secondary" id="cancel">キャンセル</button><button class="primary" style="width:auto" type="submit">保存する</button></div></form></dialog>
  <dialog id="dayDialog"><div class="modal"><h2 id="dayTitle"></h2><div class="detail-list" id="dayList"></div><div class="modal-actions"><button type="button" class="secondary" id="closeDay">閉じる</button><button type="button" class="primary" style="width:auto" id="addFromDay">追加する</button></div></div></dialog>
  <dialog id="authDialog"><form class="modal" id="authForm"><h2>同期アカウント</h2><p class="empty">メールアドレスとパスワードで、スマホとPCを同期できます。</p><label for="authEmail">メールアドレス</label><input id="authEmail" type="email" autocomplete="email" required><label for="authPassword">パスワード（6文字以上）</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required><p class="empty" id="authMessage"></p><div class="modal-actions"><button type="button" class="secondary" id="cancelAuth">キャンセル</button><button type="button" class="secondary" id="googleSignIn">PCでGoogleログイン</button><button type="button" class="secondary" id="signUp">新規登録</button><button class="primary" style="width:auto" type="submit" id="emailSubmit">ログイン</button></div></form></dialog>

    let authMode='login';const needsPassword=user=>user?.providerData?.some(p=>p.providerId==='google.com')&&!user.providerData.some(p=>p.providerId==='password');
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.error);auth.onAuthStateChanged(user=>{const button=$('#syncButton');if(user){button.textContent=needsPassword(user)?'パスワードを設定':'ログアウト';button.classList.add('signed-in');startSync(user)}else{if(stopListening)stopListening();stopListening=null;syncReady=false;button.textContent='ログインして同期';button.classList.remove('signed-in');setStatus('この端末に保存中')}});
    const authError=err=>({"auth/email-already-in-use":"このメールアドレスは登録済みです。ログインを押してください。","auth/invalid-email":"メールアドレスの形式を確認してください。","auth/weak-password":"パスワードは6文字以上にしてください。","auth/user-not-found":"登録が見つかりません。新規登録してください。","auth/wrong-password":"パスワードが違います。","auth/invalid-credential":"メールアドレスまたはパスワードが違います。"}[err?.code]||'ログインできませんでした。もう一度お試しください。');
    const openAuth=()=>{authMode='login';authForm.reset();const rememberedEmail=localStorage.getItem('hibi-calendar-login-email')||'';$('#authEmail').value=rememberedEmail;$('#signUp').hidden=false;$('#googleSignIn').hidden=false;$('#emailSubmit').textContent='ログイン';$('#authMessage').textContent=rememberedEmail?'メールアドレスを入力済みです。パスワードだけ入力してください。':'初めての場合は「新規登録」を押してください。';authDialog.showModal();(rememberedEmail?$('#authPassword'):$('#authEmail')).focus()};
    const openPasswordSetup=()=>{authMode='link';authForm.reset();$('#authEmail').value=auth.currentUser.email||'';$('#authEmail').readOnly=true;$('#signUp').hidden=true;$('#googleSignIn').hidden=true;$('#emailSubmit').textContent='パスワードを設定';$('#authMessage').textContent='このGoogleアカウント用の新しいパスワードを設定してください。';authDialog.showModal();$('#authPassword').focus()};
    async function emailAuth(isSignUp){const email=$('#authEmail').value.trim(),password=$('#authPassword').value;if(!email||!password)return;$('#authMessage').textContent='処理中…';try{if(authMode==='link')await auth.currentUser.linkWithCredential(firebase.auth.EmailAuthProvider.credential(email,password));else if(isSignUp)await auth.createUserWithEmailAndPassword(email,password);else await auth.signInWithEmailAndPassword(email,password);localStorage.setItem('hibi-calendar-login-email',email);authDialog.close()}catch(err){console.error(err);$('#authMessage').textContent=authError(err)}}
    $('#syncButton').onclick=async()=>{if(auth.currentUser){if(needsPassword(auth.currentUser))openPasswordSetup();else await auth.signOut();return}openAuth()};authForm.onsubmit=e=>{e.preventDefault();emailAuth(false)};$('#signUp').onclick=()=>emailAuth(true);$('#googleSignIn').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());authDialog.close()}catch(err){$('#authMessage').textContent='PCのChromeでGoogleログインをお試しください。'}};$('#cancelAuth').onclick=()=>authDialog.close();
    function seedSavings(){const month=`${shown.getFullYear()}-${pad(shown.getMonth()+1)}`,flag=`hibi-calendar-savings-seeded-${month}`;if(localStorage.getItem(flag))return;const last=new Date(shown.getFullYear(),shown.getMonth()+1,0).getDate();for(let day=1;day<=last;day++){const date=`${month}-${pad(day)}`;['買い食い','昼ごはん'].forEach(title=>{if(!savings.some(x=>x.date===date&&x.title===title))savings.push({id:`default-${date}-${title}`,date,title,type:'normal',note:'',startTime:'00:00',endTime:'00:00',done:false})})}localStorage.setItem(flag,'1');save()}
    function render(){
      if(mode==='saving')seedSavings();
      $('#monthTitle').textContent=`${shown.getFullYear()}年 ${shown.getMonth()+1}月`;$('#addItem').textContent=`＋ ${modeName()}を追加`;$('#listTitle').textContent=`これからの${mode==='schedule'?'予定':' '+modeName()}`;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));renderProgress();renderGoals();grid.innerHTML='';
      const first=new Date(shown.getFullYear(),shown.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());
      for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const id=key(d),same=d.getMonth()===shown.getMonth(),items=current().filter(x=>x.date===id).sort((a,b)=>(startOf(a)||'99:99').localeCompare(startOf(b)||'99:99'));const cell=document.createElement('div');cell.className=`day ${same?'':'other'} ${d.getDay()===0?'sun':''} ${d.getDay()===6?'sat':''} ${id===key(today)?'is-today':''}`;cell.innerHTML=`<div class="date">${d.getDate()}</div><button class="add-day" title="追加">＋</button><div class="items"></div>`;cell.querySelector('.add-day').onclick=e=>{e.stopPropagation();openForm(id)};cell.onclick=()=>openDay(id);const box=cell.querySelector('.items');
        if(mode!=='schedule'&&items.length){const done=items.filter(x=>x.done).length,rate=Math.round(done/items.length*100);cell.insertAdjacentHTML('beforeend',`<span class="rate">${rate}%</span>`)}
        items.slice(0,3).forEach(item=>{if(mode==='schedule'){const b=document.createElement('button');b.className=`calendar-item category-${item.type||'normal'}`;b.textContent=shortTitle(item.title);b.onclick=e=>{e.stopPropagation();openForm(id,item.id)};box.append(b)}else{const row=document.createElement('div');row.className=`todo-row category-${item.type||'normal'} ${item.done?'done':''}`;const check=document.createElement('input');check.type='checkbox';check.checked=!!item.done;check.setAttribute('aria-label',`${item.title}を完了にする`);check.onclick=e=>e.stopPropagation();check.onchange=()=>toggleCheck(item.id,check.checked);const b=document.createElement('button');b.textContent=shortTitle(item.title);b.onclick=e=>{e.stopPropagation();openForm(id,item.id)};row.append(check,b);box.append(row)}});grid.append(cell)}renderAgenda();
    }
    function renderAgenda(){const box=$('#agenda');box.innerHTML='';const upcoming=current().filter(x=>x.date>=key(today)).sort((a,b)=>`${a.date}${startOf(a)||'99:99'}`.localeCompare(`${b.date}${startOf(b)||'99:99'}`)).slice(0,5);if(!upcoming.length){box.innerHTML=`<p class="empty">${modeName()}はまだありません。<br>新しく追加してみましょう。</p>`;return}upcoming.forEach(item=>{const d=new Date(item.date+'T00:00:00'),x=document.createElement('div');x.className='agenda-item';const doneControl=mode!=='schedule'?`<input class="agenda-check" type="checkbox" ${item.done?'checked':''} aria-label="完了">`:'';x.innerHTML=`<div class="agenda-date">${d.getMonth()+1}/${d.getDate()}</div><div class="agenda-main">${doneControl}<button class="agenda-content"><strong>${escapeHtml(timeLabel(item)?timeLabel(item)+' '+item.title:item.title)}</strong><span>${escapeHtml(item.note||modeName())}</span></button></div>`;if(mode!=='schedule')x.querySelector('input').onchange=e=>toggleCheck(item.id,e.target.checked);x.querySelector('button').onclick=()=>openForm(item.date,item.id);box.append(x)})}
    const todoCategories=[['sns','SNS・人材'],['education','教育'],['sidejob','副業'],['work','仕事'],['other','その他']],statusCategories=todoCategories.filter(([id])=>id!=='other');
    function rankTitle(level){if(level>=20)return '👑 習慣の王';if(level>=15)return '🌟 時間管理マスター';if(level>=10)return '🔥 継続の達人';if(level>=5)return '🚀 行動派';return '🌱 はじめの一歩'}
    function setupCategory(value){const select=$('#itemType');if(mode==='todo')select.innerHTML=todoCategories.map(([id,name])=>`<option value="${id}">${name}</option>`).join('');else select.innerHTML='<option value="normal">通常</option><option value="work">仕事</option><option value="personal">プライベート</option><option value="important">大切</option><option value="shop">ショップ</option><option value="event">イベント</option><option value="other">その他</option>';select.value=[...select.options].some(o=>o.value===value)?value:(mode==='todo'?'sns':'normal')}
    function renderProgress(){const card=$('#progressCard'),title=$('#progressTitle'),body=$('#progressBody');if(mode==='schedule'){card.hidden=true;return}card.hidden=false;if(mode==='todo'){const xp=todos.filter(x=>x.done).length*10,level=Math.floor(xp/100)+1,inLevel=xp%100,statuses=statusCategories.map(([id,name])=>{const count=todos.filter(x=>x.done&&x.type===id).length;return `<div class="status-box"><strong>${name}</strong><span>ステータス Lv.${Math.floor(count/5)+1}</span><small>達成 ${count} 件</small></div>`}).join('');title.textContent=`レベル ${level}`;body.innerHTML=`<span class="title-badge">称号：${rankTitle(level)}</span><div class="progress-number">${xp} <small>XP（完了1件 +10 XP）</small></div><div class="meter"><i style="width:${inLevel}%"></i></div><small>${100-inLevel} XPで次のレベル</small><div class="status-grid">${statuses}</div>`}else{const month=key(today).slice(0,7),count=savings.filter(x=>x.done&&x.date?.startsWith(month)).length,total=count*500;title.textContent='今月の節約';body.innerHTML=`<div class="saving-total"><strong>¥${total.toLocaleString()}</strong><span>${count} 件達成 × ¥500</span></div>`}}
    function toggleCheck(id,done){if(mode==='todo')todos=todos.map(x=>x.id===id?{...x,done}:x);else savings=savings.map(x=>x.id===id?{...x,done}:x);save();render()}
    function renderGoals(){const card=$('#goalsCard'),list=$('#goalList');card.hidden=mode!=='todo';if(mode!=='todo')return;list.innerHTML='';if(!goals.length){list.innerHTML='<p class="empty">長期的な目標を書いてみましょう。</p>';return}goals.forEach(goal=>{const item=document.createElement('div');item.className=`goal-item ${goal.done?'done':''}`;item.innerHTML=`<input type="checkbox" ${goal.done?'checked':''} aria-label="目標を達成にする"><span>${escapeHtml(goal.text)}</span><button type="button" aria-label="目標を削除">×</button>`;item.querySelector('input').onchange=e=>{goals=goals.map(x=>x.id===goal.id?{...x,done:e.target.checked}:x);save();renderGoals()};item.querySelector('button').onclick=()=>{goals=goals.filter(x=>x.id!==goal.id);save();renderGoals()};list.append(item)})}
    function openDay(date){const list=current().filter(x=>x.date===date).sort((a,b)=>(startOf(a)||'99:99').localeCompare(startOf(b)||'99:99'));const d=new Date(date+'T00:00:00');$('#dayTitle').textContent=`${dateText(d)} の${modeName()}`;const box=$('#dayList');box.innerHTML='';if(!list.length)box.innerHTML='<p class="empty">この日の項目はありません。</p>';list.forEach(item=>{const row=document.createElement('article');row.className=`detail-item category-${item.type||'normal'}`;const meta=[timeLabel(item),item.note].filter(Boolean).map(escapeHtml).join('<br>');row.innerHTML=`<h3>${mode!=='schedule'&&item.done?'✓ ':''}${escapeHtml(item.title)}</h3>${meta?`<p>${meta}</p>`:''}<button type="button">編集する</button>`;row.querySelector('button').onclick=()=>{dayDialog.close();openForm(date,item.id)};box.append(row)});$('#addFromDay').onclick=()=>{dayDialog.close();openForm(date)};dayDialog.showModal()}
    function openForm(date,id){const item=current().find(x=>x.id===id),isTodoRange=mode==='todo'&&!item;$('#formTitle').textContent=`${modeName()}を${item?'編集':'追加'}`;$('#itemId').value=item?.id||'';$('#itemDate').value=item?.date||date||key(today);$('#itemDateLabel').textContent=isTodoRange?'開始日':'日付';$('#itemEndDate').value=item?.date||date||key(today);$('#rangeEndField').hidden=!isTodoRange;$('#startTime').value=startOf(item||{});$('#endTime').value=item?.endTime||'';$('#itemTitle').value=item?.title||'';$('#itemTitleLabel').textContent=mode==='saving'?'内容':'予定';$('#itemTitle').placeholder=mode==='saving'?'例：買い食いをしなかった':'例：チームミーティング';setupCategory(item?.type);$('#itemNote').value=item?.note||'';document.querySelectorAll('.saving-hide').forEach(el=>el.hidden=mode==='saving');$('#itemDone').checked=!!item?.done;$('#completeField').hidden=mode==='schedule';$('#completeField').lastChild.textContent=mode==='saving'?' 節約できた':' 完了にする';$('#deleteItem').hidden=!item;dialog.showModal();$('#itemTitle').focus()}
    form.onsubmit=e=>{e.preventDefault();const id=$('#itemId').value,enteredStart=$('#startTime').value,enteredEnd=$('#endTime').value,startDate=$('#itemDate').value,endDate=$('#itemEndDate').value;if(enteredStart&&enteredEnd&&enteredEnd<enteredStart){alert('終了時刻は開始時刻より後にしてください。');return}if(mode==='todo'&&!id&&endDate<startDate){alert('終了日は開始日以降にしてください。');return}const item={id:id||crypto.randomUUID(),date:startDate,startTime:enteredStart||'00:00',endTime:enteredEnd||'00:00',title:$('#itemTitle').value.trim(),type:$('#itemType').value,note:$('#itemNote').value.trim(),done:mode!=='schedule'&&$('#itemDone').checked};if(!item.title)return;if(mode==='schedule')events=id?events.map(x=>x.id===id?item:x):[...events,item];else if(mode==='todo'){if(id)todos=todos.map(x=>x.id===id?item:x);else{const from=new Date(`${startDate}T00:00:00`),to=new Date(`${endDate}T00:00:00`),added=[];for(let day=new Date(from);day<=to;day.setDate(day.getDate()+1))added.push({...item,id:crypto.randomUUID(),date:key(day)});todos=[...todos,...added]}}else savings=id?savings.map(x=>x.id===id?item:x):[...savings,item];save();dialog.close();render()};
    $('#deleteItem').onclick=()=>{const id=$('#itemId').value;if(mode==='schedule')events=events.filter(x=>x.id!==id);else if(mode==='todo')todos=todos.filter(x=>x.id!==id);else savings=savings.filter(x=>x.id!==id);save();dialog.close();render()};$('#cancel').onclick=()=>dialog.close();$('#closeDay').onclick=()=>dayDialog.close();$('#addItem').onclick=()=>openForm();$('#goalForm').onsubmit=e=>{e.preventDefault();const text=$('#goalInput').value.trim();if(!text)return;goals.push({id:crypto.randomUUID(),text});$('#goalInput').value='';save();renderGoals()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});$('#prev').onclick=()=>{shown.setMonth(shown.getMonth()-1);render()};$('#next').onclick=()=>{shown.setMonth(shown.getMonth()+1);render()};$('#goToday').onclick=()=>{shown=new Date(today.getFullYear(),today.getMonth(),1);render()};render();
  </script>
